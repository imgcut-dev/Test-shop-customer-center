<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 모아보기 · 꼬순내 마켓</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#f2f4f6;--panel:#fff;--fg:#191f28;--mute:#6b7684;--line:#e5e8eb;--accent:#3182f6;--tint:#e8f3ff;--tintfg:#1b64da;--warn:#f04452}
@media (prefers-color-scheme:dark){:root{--bg:#101013;--panel:#17171c;--fg:#f9fafb;--mute:#8b95a1;--line:#2c2c35;--accent:#4593fc;--tint:#1c3050;--tintfg:#6ea8fe;--warn:#ff6b7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;padding:16px}
.w{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar button,.bar select,.bar input{font:inherit;font-size:15px;border:0;border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--fg);min-height:40px}
.bar button{background:var(--tint);color:var(--tintfg);font-weight:600;cursor:pointer}.bar button.on{background:var(--accent);color:#fff}
.bar input{flex:1;min-width:140px}
.l{background:var(--panel);border-radius:24px;padding:8px}
a.r{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;color:inherit;text-decoration:none}a.r:hover{background:var(--bg)}
.ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.i{flex:1;min-width:0}.n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m{font-size:14px;color:var(--mute)}
.p{text-align:right;flex:none}.p b{display:block}.t{display:inline-block;border-radius:6px;background:var(--tint);color:var(--tintfg);padding:0 6px;font-size:13px;font-weight:600}.t.no{background:rgba(240,68,82,.12);color:var(--warn)}
.e,.back{display:block;text-align:center;color:var(--mute);padding:24px}.back{color:var(--tintfg);font-weight:600;text-decoration:none}
</style></head><body><div class="w"><h1>꼬순내 마켓 상품</h1>
<div class="bar" id="bar"></div><div class="l" id="l"><div class="e">불러오는 중…</div></div><a class="back" href="./">대화로 돌아가기</a></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDpRb5sLKFcrphR8Xja75_6lGOYigtlLg0",authDomain:"test-shop-customer-center.firebaseapp.com",projectId:"test-shop-customer-center",storageBucket:"test-shop-customer-center.firebasestorage.app",messagingSenderId:"972433891288",appId:"1:972433891288:web:14892b14c37418539b1cad"});
const db=firebase.firestore(),qs=new URLSearchParams(location.search),won=n=>Number(n||0).toLocaleString('ko-KR')+'원',EMO={사료:'🥣',간식:'🦴',영양제:'💊'};
const mk=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
let cat=qs.get('cat')||'전체',sort=qs.get('sort')||'discount',q=qs.get('q')||'',max=Number(qs.get('max'))||Infinity,items=[];
const bar=document.getElementById('bar'),l=document.getElementById('l');
function draw(){
  bar.textContent='';
  ['전체','사료','간식','영양제'].forEach(c=>{const b=mk('button',c,c===cat?'on':'');b.onclick=()=>{cat=c;draw()};bar.append(b)});
  const sel=mk('select');[['discount','할인율순'],['price','낮은 가격순']].forEach(([v,t])=>{const o=mk('option',t);o.value=v;o.selected=v===sort;sel.append(o)});sel.onchange=()=>{sort=sel.value;draw()};
  const inp=mk('input');inp.type='search';inp.placeholder='상품명 검색';inp.value=q;inp.setAttribute('aria-label','상품명 검색');inp.onchange=()=>{q=inp.value.trim();draw()};
  bar.append(sel,inp);
  let r=items.filter(x=>(cat==='전체'||x.category===cat)&&x.salePrice<=max&&(!q||(x.name+(x.note||'')).includes(q)));
  r.sort((a,b)=>sort==='price'?a.salePrice-b.salePrice:b.rate-a.rate);
  l.textContent='';if(!r.length){l.append(mk('div','조건에 맞는 상품이 없어요.','e'));return}
  r.forEach(x=>{const a=mk('a',null,'r');a.href='product.html?id='+x.id;
    const i=mk('div',null,'i');i.append(mk('div',x.name,'n'),mk('div',(x.category||'')+(x.note?' · '+x.note:''),'m'));
    const p=mk('div',null,'p');p.append(mk('b',won(x.salePrice)),mk('span',x.qty>0?(x.rate>0?x.rate+'% 할인':'판매중'):'품절','t'+(x.qty>0?'':' no')));
    a.append(mk('div',EMO[x.category]||'🐾','ic'),i,p);l.append(a)});
}
Promise.all([db.collection('products').get(),db.collection('stock').get()]).then(([P,S])=>{
  const st={};S.forEach(d=>st[d.id]=Number(d.data().qty));
  P.forEach(d=>{const p=d.data();items.push({id:d.id,...p,qty:st[d.id]||0,rate:p.price?Math.round((1-p.salePrice/p.price)*100):0})});draw();
}).catch(()=>{l.textContent='상품을 불러오지 못했어요.'});
</script></body></html>
