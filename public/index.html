<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꼬순내 마켓</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap">
<style>
html,body{margin:0}

:root{--bg:#f3f6f4;--panel:#fff;--fg:#17211c;--mute:#667570;--line:#dde5e0;--accent:#0f8a6a;--accent-fg:#fff;--bot:#ecf1ee;--warn:#c0392b;--ok:#0f8a6a;--font:'Noto Sans KR',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1411;--panel:#161e1a;--fg:#e8efeb;--mute:#8a9892;--line:#26322d;--accent:#34c79e;--accent-fg:#06231a;--bot:#202b26;--warn:#ff8a7a;--ok:#34c79e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1411;--panel:#161e1a;--fg:#e8efeb;--mute:#8a9892;--line:#26322d;--accent:#34c79e;--accent-fg:#06231a;--bot:#202b26;--warn:#ff8a7a;--ok:#34c79e;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.wrap.wide{max-width:1000px}
.top{display:flex;align-items:center;gap:10px;flex:none}
.top h1{font-size:17px;margin:0}
.top .sp{flex:1}
.top a{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:var(--panel)}
[hidden]{display:none!important}
.card{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;flex:none}
.hd b{display:block;line-height:1.3}.hd small{color:var(--mute);font-size:12px}
.home{margin-left:auto;font:inherit;font-size:13px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer}
.home:hover{border-color:var(--accent)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{max-width:86%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.m.user{background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px;align-self:flex-end}
.m.err{color:var(--warn)}
.info{align-self:flex-start;max-width:92%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.info dt{color:var(--mute)}.info dd{margin:0;overflow-wrap:anywhere}
.info h3{grid-column:1/-1;margin:0 0 4px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 8px;background:var(--bot);color:var(--accent)}
.tag.no{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}.chips[hidden]{display:none}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}.gl{font-size:12px;color:var(--mute);min-width:64px}
.chips button{font:inherit;font-size:13px;background:none;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
form.in{display:flex;align-items:flex-end;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{box-sizing:border-box;flex:1;font:inherit;line-height:1.5;resize:none;overflow-y:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-height:120px;min-width:0}
textarea:focus,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:0 18px;height:40px;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.dots::after{content:"…";animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
.note{font-size:12px;color:var(--mute)}
/* admin */
.tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:99px;padding:5px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:700}
.adm{flex:1;min-height:0;overflow:auto;padding:12px 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--mute);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 4px;border-bottom:1px solid var(--line)}
td input{font:inherit;font-size:13px;width:100%;min-width:70px;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid transparent;border-radius:6px;padding:5px 6px}
td input:hover{border-color:var(--line)}td input.num{text-align:right}td input[readonly]{color:var(--mute);background:none}
td.nm input{min-width:220px}
.del{font:inherit;font-size:12px;color:var(--warn);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.bar input{font:inherit;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:150px}
.bar .btn{font:inherit;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
.bar a{color:var(--accent);font-size:13px}
#st{margin-left:auto;font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi small{display:block;color:var(--mute);font-size:12px}
.kpi b{font-size:22px;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:12px;color:var(--mute)}
.sec{margin-top:20px}.sec h3{font-size:14px;margin:0 0 8px}
.al{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 12px;background:var(--bg)}
.pill.no{color:var(--warn);border-color:var(--warn)}
.pill.low{color:#b7791f}
.br{display:grid;grid-template-columns:90px 1fr 36px;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
.br span.t{height:10px;border-radius:5px;background:var(--bot);overflow:hidden}.br span.t span{display:block;height:100%;background:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
td.txt{white-space:normal;padding:6px;min-width:120px;max-width:340px;overflow-wrap:anywhere;vertical-align:top}
td.dim{color:var(--mute);white-space:nowrap;padding:6px;vertical-align:top}
/* admin: PC layout */
.wrap.wide{max-width:1480px;min-width:1040px;width:100%}
[data-view="admin"]{font-size:14px}
.adbody{flex:1;min-height:0;display:flex}
.adbody .tabs{flex-direction:column;flex-wrap:nowrap;width:200px;flex:none;padding:14px 12px;gap:4px;border-right:1px solid var(--line);overflow-y:auto}
.adbody .tabs button{text-align:left;border:0;border-radius:8px;padding:9px 12px;font-size:14px}
.adbody .tabs button:hover{background:var(--bot)}
.adbody .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.adbody .main{flex:1;min-width:0;display:flex;flex-direction:column}
.adbody .adm{padding:20px 28px}
.adbody .bar{padding:10px 28px}
.adbody .kpis{grid-template-columns:repeat(6,1fr)}
.adbody .kpi{padding:14px 16px}.adbody .kpi b{font-size:24px}
.adbody table{font-size:14px}
.adbody td input{font-size:14px;padding:6px 8px}
.adbody td.txt{max-width:420px}
.adbody .tabs button.g-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em;padding:16px 12px 6px;border-radius:0;background:none}
.adbody .tabs button.g-head:hover{background:none;color:var(--fg)}
.adbody .tabs button.g-item{padding-left:24px}
.adbody .tabs button.g-top{font-weight:700}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel.wide{grid-column:1/-1}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}.ph h3{margin:0;font-size:15px}
.lnk{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 0;text-align:left}
.panel .sub{font-size:12px;font-weight:700;color:var(--mute);margin-top:6px}
.panel .ln{font-size:13px;overflow-wrap:anywhere;padding:3px 0;border-bottom:1px dashed var(--line)}
.panel .ln:last-child{border-bottom:0}
button.kpi{font:inherit;color:inherit;background:none;text-align:left;cursor:pointer}
button.kpi:hover{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:820px}.fld label{font-weight:500}
.fld input,.fld textarea,select,.kv input{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fld textarea{resize:vertical;line-height:1.6}
.btns{display:flex;align-items:center;gap:10px}
.btn2{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:8px 20px;cursor:pointer}
.btn3{font:inherit;background:none;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
pre.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:300px;overflow:auto;font:12.5px/1.6 ui-monospace,Menlo,monospace;margin:0}
td textarea{font:inherit;font-size:14px;width:100%;min-width:260px;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid transparent;border-radius:6px;padding:6px 8px;resize:vertical}
td textarea:hover{border-color:var(--line)}
/* 꼬순내 마켓 (고객 화면) */
body.cust{--bg:#fff7ec;--panel:#fffdf8;--fg:#3a2a1c;--mute:#8a7664;--line:#f0dfca;--accent:#e8791a;--accent-fg:#fff;--bot:#fdeedd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.cust{--bg:#1c1510;--panel:#251c15;--fg:#f6e9db;--mute:#b39d86;--line:#3a2c20;--accent:#ffa24d;--accent-fg:#2b1700;--bot:#33261b}}
:root[data-theme="dark"] body.cust{--bg:#1c1510;--panel:#251c15;--fg:#f6e9db;--mute:#b39d86;--line:#3a2c20;--accent:#ffa24d;--accent-fg:#2b1700;--bot:#33261b}
.wrap.shop{max-width:1120px}
body.cust .top h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:24px;color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;gap:16px}
.front{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.chatcard{flex:0 0 400px;border-radius:20px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:20px;padding:20px 24px;background:linear-gradient(135deg,rgba(232,121,26,.22),rgba(255,196,120,.2))}
.hero h2{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:26px;margin:0 0 4px}
.hero p{margin:0;color:var(--mute)}.hero .big{margin-top:6px;font-size:13px}
.hero-ic{font-size:56px;line-height:1}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 16px;cursor:pointer}
.cats button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:700}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{font:inherit;color:var(--fg);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile{transition:transform .15s,border-color .15s}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.tile .ic{position:relative;border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;font-size:44px}
.c-a{background:rgba(232,121,26,.16)}.c-b{background:rgba(236,72,120,.14)}.c-c{background:rgba(59,130,246,.14)}
.tile .bd{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;border-radius:99px;padding:0 8px;background:var(--panel)}
.tile .bd.no{color:var(--warn)}.tile .bd.low{color:#b7791f}
.tn{font-size:13px;line-height:1.4;min-height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tp b{font-size:15px}.tp .rt{margin-left:6px;font-size:12px;font-weight:700;color:var(--warn)}
body.cust .card{border-radius:20px}
body.cust .hd b{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:17px}
body.cust .sec h3,body.cust .ph h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:16px}
body.cust .kpi{border-radius:16px;border-color:transparent}
body.cust .kpi b{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:26px}
.kpis .kpi:nth-child(6n+1){background:rgba(232,121,26,.12)}
.kpis .kpi:nth-child(6n+2){background:rgba(236,72,120,.11)}
.kpis .kpi:nth-child(6n+3){background:rgba(59,130,246,.11)}
.kpis .kpi:nth-child(6n+4){background:rgba(34,160,110,.12)}
.kpis .kpi:nth-child(6n+5){background:rgba(234,179,8,.14)}
.kpis .kpi:nth-child(6n+6){background:rgba(139,92,246,.11)}
body.cust .panel{border-radius:16px;background:var(--panel)}
body.cust .adbody .tabs{background:rgba(232,121,26,.05)}
body.cust .adbody .tabs button{border-radius:12px}
body.cust .pill{background:var(--panel)}
body.cust .m{border-radius:18px}
body.cust .m.bot{border-bottom-left-radius:6px}
body.cust .m.user{border-bottom-right-radius:6px}
body.cust .hd .av{font-size:20px}
@media (max-width:899px){.stage{flex-direction:column}.front{flex:none;overflow:visible}.hero,.cats{display:none}
 .pgrid2{display:flex;overflow-x:auto;padding-bottom:6px}.tile{flex:0 0 130px}
 .chatcard{flex:1;min-height:380px}}
.deny{white-space:pre-line;padding:40px 16px;text-align:center;color:var(--mute)}

</style>
</head>
<body>

<div class="wrap" id="root">
  <div class="top"><h1 id="brand">🐾 꼬순내 마켓</h1><span class="sp"></span><a href="#admin" id="lnkAdmin" hidden>관리자</a><a href="#chat" id="lnkChat" hidden>고객 채팅</a></div>
  <div class="stage" data-view="chat"><aside class="front" id="front"></aside>
  <section class="card chatcard">
    <div class="hd"><div class="av">🐶</div><div><b id="hdName">보리</b><small id="sub">꼬순내 마켓 상담 도우미 · 보통 바로 답해요</small></div><button type="button" class="home" id="homeBtn">처음으로</button></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="in" id="f"><textarea id="t" rows="1" placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea><button class="send" id="send" type="submit">전송</button></form>
  </section></div>
  <section class="card" data-view="admin" hidden>
    <div class="hd"><div class="av">🐾</div><div><b>꼬순내 마켓 관리자</b><small>오늘도 꼬순내 나는 하루예요 · 대시보드, 질문 분석, 보리 설정, FAQ, 데이터 관리</small></div></div>
    <div class="adbody">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="main"><div class="adm" id="adm"></div><div class="bar" id="bar"></div></div>
    </div>
  </section>

<script>
/* 아티팩트 밖에서 쓰기 위한 대체 구현: db(localStorage) · user · sample(Anthropic API 직접 호출) */
(function(){
  const DBK='kkm_db',KEYK='kkm_api_key',MODK='kkm_models',UIDK='kkm_uid';
  const clone=o=>JSON.parse(JSON.stringify(o));
  let store=null;
  try{store=JSON.parse(localStorage.getItem(DBK)||'null')}catch(e){}
  if(!store){store=clone(window.__SEED__);persist()}
  function persist(){try{localStorage.setItem(DBK,JSON.stringify(store))}catch(e){}}
  const subs=[];
  const snapDoc=p=>({id:p.split('/').pop(),exists:p in store,data:()=>p in store?clone(store[p]):undefined});
  const colDocs=c=>{const n=c.split('/').length+1;return Object.keys(store).filter(p=>p.startsWith(c+'/')&&p.split('/').length===n).sort().map(snapDoc)};
  const colSnap=c=>{const d=colDocs(c);return {docs:d,size:d.length,empty:!d.length}};
  function fire(s){s.kind==='doc'?s.cb(snapDoc(s.path)):s.cb(colSnap(s.path))}
  function notify(p){const n=p.split('/').length;subs.forEach(s=>{if(s.kind==='doc'&&s.path===p)fire(s);if(s.kind==='col'&&p.startsWith(s.path+'/')&&n===s.path.split('/').length+1)fire(s)})}
  function sub(kind,path,cb){const s={kind,path,cb};subs.push(s);setTimeout(()=>fire(s),0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
  const db={
    doc:p=>({id:p.split('/').pop(),path:p,
      get:async()=>snapDoc(p),
      set:async o=>{store[p]=clone(o);persist();notify(p)},
      update:async o=>{store[p]={...(store[p]||{}),...clone(o)};persist();notify(p)},
      delete:async()=>{delete store[p];persist();notify(p)},
      onSnapshot:cb=>sub('doc',p,cb)}),
    collection:c=>({path:c,doc:id=>db.doc(c+'/'+id),get:async()=>colSnap(c),onSnapshot:cb=>sub('col',c,cb)})
  };
  window.addEventListener('storage',e=>{if(e.key!==DBK)return;try{store=JSON.parse(e.newValue||'{}')}catch(x){return}subs.forEach(fire)});
  /* user: 이 브라우저의 사용자는 관리자 */
  let uid=null;try{uid=localStorage.getItem(UIDK)}catch(e){}
  if(!uid){uid='u_'+Math.random().toString(36).slice(2,12);try{localStorage.setItem(UIDK,uid)}catch(e){}}
  const user={isOwner:async()=>true,canEdit:async()=>true,id:async()=>uid,can:async()=>true};
  /* sample: 로컬 서버(/api/ask)가 .env의 키로 Claude를 대신 호출 */
  async function sample(input,opts={}){
    const messages=typeof input==='string'?[{role:'user',content:input}]:input;
    let res;
    try{res=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages,tier:opts.modelTier||'quick'})})}
    catch(e){throw {code:'network',message:'로컬 서버에 연결할 수 없어요. 터미널에서 npm start가 실행 중인지 확인해 주세요.'}}
    if(!res.ok){let m='';try{m=(await res.json()).message||''}catch(e){}throw {code:res.status===429?'rate_limited':'api_error',message:m||`서버 오류(${res.status})`}}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;
        try{const ev=JSON.parse(line.slice(5).trim());if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.text){text+=ev.delta.text;if(opts.onText)opts.onText({text,delta:ev.delta.text})}}catch(e){}
      }
    }
    return {text,truncated:false};
  }
  window.STANDALONE=true;
  window.claude={use:async n=>({db,user,sample})[n]||null};
})();

function normOrder(m){const r=m.match(/ORD-?\s?(\d{3,})/i);return r?'ORD-'+r[1]:null}
function matchProducts(msg){
  let best=0,out=[];
  for(const [id,p] of Object.entries(D.products)){
    const toks=(p.name||'').replace(/[\[\]()+×,·&]/g,' ').split(/\s+/).filter(x=>x.length>=2);
    let s=toks.filter(x=>msg.includes(x)).length;if(p.category&&msg.includes(p.category))s+=.5;if(msg.toUpperCase().includes(id))s+=3;
    if(s>0){if(s>best){best=s;out=[id]}else if(s===best)out.push(id)}
  }
  return out.slice(0,4);
}
function fast(msg){ // AI 없이 바로 답하면 true
  const oid=normOrder(msg);

    if(!D.orders[oid]){add('bot',`${oid} 주문을 못 찾았어요 😢 주문번호를 한 번만 더 확인해 주세요.`);pending=null;return true}

  }
  if(pending&&/^\s*\d{4}\s*$/.test(msg))return verify(pending,msg.trim());

  const ask=/(지금|오늘|내일|주문하면|결제하면|주문\s?시).*(언제|며칠|얼마나).*(받|도착|배송|오)/.test(msg)||/배송.*(예상|얼마나|며칠|기간)|예상.*(배송|도착)/.test(msg)||(/(며칠|얼마나).*(걸리|걸려)/.test(msg)&&/배송|도착|받/.test(msg));
  if(!own&&ask){
    const e=shipEstimate();add('bot',e.text);sums.push('배송 예상: '+e.text);lastKind='ship';
    const ids=matchProducts(msg);if(ids.length===1&&Number((D.stock[ids[0]]||{}).qty)<=0){const r=(D.stock[ids[0]]||{}).restock;add('bot',`※ ${pname(ids[0])}은(는) 현재 품절이에요.${r?` 입고예정일(${r}) 이후에 출고돼요.`:''}`);productCard(ids[0])}
    return true;
  }
  const fq=faqMatch(msg);
  if(fq){add('bot',fq.a);sums.push(`FAQ(${fq.q}): ${fq.a}`);lastKind='faq';return true}
  if(/(주문|배송|택배|운송장).*(조회|확인|언제|어디|왔|상태|추적)/.test(msg)||msg==='주문/배송 조회'){pending=null;add('bot','주문번호를 알려 주세요! 예: ORD-0000 🐾');return true}
  if(/할인.*(많|큰|높)|제일.*할인/.test(msg)){
    const r=Object.entries(D.products).map(([id,p])=>[id,p.price?1-p.salePrice/p.price:0]).sort((a,b)=>b[1]-a[1]).slice(0,3);
    if(r.length){add('bot','지금 제일 많이 할인하는 친구들이에요 🎉');r.forEach(([id])=>productCard(id));return true}
  }
  if(/임박/.test(msg)){
    const ids=Object.keys(D.products).filter(id=>/임박/.test(D.products[id].note||'')&&Number((D.stock[id]||{}).qty)>0).slice(0,4);
    if(ids.length){add('bot','유통기한이 임박해서 더 저렴한 상품이에요. 기한만 꼭 확인해 주세요!');ids.forEach(productCard);return true}
  }
  const cat=['사료','간식','영양제'].find(c=>msg.includes(c));
  if(cat&&/저렴|싼|이하|미만/.test(msg)){
    const m=msg.match(/(\d+)\s?만\s?원/),lim=m?Number(m[1])*10000:Infinity;
    const ids=Object.entries(D.products).filter(([id,p])=>p.category===cat&&Number(p.salePrice)<=lim&&Number((D.stock[id]||{}).qty)>0).sort((a,b)=>a[1].salePrice-b[1].salePrice).slice(0,m?4:3).map(x=>x[0]);
    add('bot',ids.length?`${cat} 중 ${m?m[1]+'만원 이하 ':'가장 저렴한 '}재고 있는 상품이에요 🐾`:'조건에 맞는 재고 있는 상품이 없어요.');ids.forEach(productCard);return true;

    const ids=matchProducts(msg);

  }
  return false;
}

  return true;

function shipEstimate(now=new Date()){
  const a=AG(),isBiz=d=>d.getDay()>0&&d.getDay()<6;
  const nextBiz=d=>{const x=new Date(d);do{x.setDate(x.getDate()+1)}while(!isBiz(x));return x};
  const addBiz=(d,n)=>{let x=new Date(d);for(let i=0;i<n;i++)x=nextBiz(x);return x};
  let ship=new Date(now);ship.setHours(0,0,0,0);
  if(!isBiz(ship)||now.getHours()>=Number(a.shipCutoff))ship=nextBiz(ship);
  ship=addBiz(ship,Math.max(0,Number(a.shipHandling)-1));
  const from=addBiz(ship,Number(a.shipMin)),to=addBiz(ship,Math.max(Number(a.shipMin),Number(a.shipMax)));
  const f=d=>`${d.getMonth()+1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]})`;
  const range=from.getTime()===to.getTime()?f(from):f(from)+'~'+f(to);
  return {ship:f(ship),range,text:`지금 주문하시면 ${f(ship)}에 출고되어 ${range}에 도착할 예정이에요 📦 (평일 ${a.shipCutoff}시 이전 결제 기준, 주말·공휴일 제외, 지역과 택배 상황에 따라 달라질 수 있어요)`};
}
function buildPrompt(m){const a=AG(),e=shipEstimate();return a.instructions+'\n말투: '+a.tone+'\n\n[배송 안내 기준]\n지금 주문하면 '+e.ship+' 출고, 도착 예상 '+e.range+' (평일 '+a.shipCutoff+'시 이전 결제 기준, 주말·공휴일 제외). 고객이 예상 배송일을 물으면 이 내용으로 답하세요.\n\n[FAQ·정책 정보]\n'+(faqText()||'(없음)')+'\n\n[상품 데이터]\n'+catalog()+'\n\n[고객 메시지]\n'+m}
function faqMatch(msg){
  const m=msg.replace(/\s+/g,'');let best=null,bs=0;
  for(const f of faqList()){const sc=String(f.keywords||'').split(/[,，]/).map(x=>x.replace(/\s+/g,'')).filter(Boolean).filter(k=>m.includes(k)).length;if(sc>bs){bs=sc;best=f}}
  return best;
}

async function send(text){

  if(text===HOME){home();return}busy=true;btn.disabled=true;chips.hidden=true;t.value='';t.style.height='auto';
  add('user',text);atHome=false;lastKind=null;sums=[];lastBot='';const t0=Date.now();
  try{
    if(fast(text)){if(sums.length)hist.push({role:'user',content:text},{role:'assistant',content:'[카드로 안내함] '+sums.join(' / ')});logChat(text,sums.length?sums.join(' / '):lastBot,'fast',Date.now()-t0,lastKind||'rule');return}
    hist.push({role:'user',content:text});
    const b=add('bot','');b.classList.add('dots');
    if(!sample)throw {message:'앗, 지금은 AI 상담을 쓸 수 없어요. 주문번호 조회와 재고 문의는 바로 도와드릴 수 있어요!'};
    let h=hist.slice(-Math.max(2,Number(AG().historyN)||8));while(h.length&&h[0].role!=='user')h.shift();
    const msgs=h.map((m,i)=>i===0?{role:'user',content:buildPrompt(m.content)}:m);
    const r=await sample(msgs,{cache:false,modelTier:AG().tier||'quick',onText:({text})=>{b.classList.remove('dots');b.textContent=text;bottom()}});
    b.classList.remove('dots');b.textContent=r.text;bottom();hist.push({role:'assistant',content:r.text});logChat(text,r.text,'ai',Date.now()-t0);
  }catch(e){
    if(hist.length&&hist[hist.length-1].role==='user')hist.pop();
    logChat(text,(e&&e.message)||(e&&e.code)||'오류','error',Date.now()-t0);
    const l=log.lastChild;if(l&&l.classList.contains('dots')){l.classList.remove('dots');l.classList.add('err');l.textContent=e.code==='not_granted'?'AI 사용 권한이 거부되었습니다.':e.code==='rate_limited'?'요청이 많습니다. 잠시 후 다시 시도하세요.':(e.message||'오류가 났어요. 다시 시도해 주세요.')}
  }finally{busy=false;btn.disabled=false;t.focus();bottom();setChips(lastKind==='product'?['비슷한 상품 추천해줘','교환/환불 가능한가요?',HOME]:lastKind==='order'?['배송이 늦어지면 어떻게 하나요?','주문 취소하고 싶어요',HOME]:[HOME])}
}

  n.style.cssText='font-size:14px;line-height:1.8;max-width:760px';
  n.append(mk('p',null,'이 화면에는 API 키 입력칸을 만들지 않았어요. 두 가지 이유가 있어요.'));

  ol.append(mk('li',null,'지금은 아티팩트에 내장된 Claude를 쓰기 때문에 키가 필요 없고, 이 페이지에서는 외부 주소(api.anthropic.com)로 직접 요청을 보낼 수도 없어요.'),mk('li',null,'브라우저 화면에 저장한 키는 열람자가 개발자 도구로 볼 수 있어요. 키가 새면 요금이 계정으로 청구돼요.'));
  n.append(ol);
  n.append(mk('p',null,'Firebase로 옮기면 키는 서버(Cloud Functions의 비밀 저장소)에만 등록해요. 관리자 화면에서는 이 연결 테스트와 사용 현황을 그대로 쓰고, 키 자체는 터미널에서 한 번만 등록합니다.'));
  const pre=mk('pre','prompt','firebase functions:secrets:set ANTHROPIC_API_KEY');

}
function renderQA(box){
  const g={};CH.forEach(c=>{const q=c.q.trim();(g[q]=g[q]||{q,n:0,kinds:{},last:c}).n++;g[q].kinds[c.kind]=(g[q].kinds[c.kind]||0)+1});
  const list=Object.values(g).sort((x,y)=>y.n-x.n);
  const aiN=CH.filter(c=>c.kind==='ai').length,fastN=CH.filter(c=>c.kind==='fast').length,errN=CH.filter(c=>c.kind==='error').length;
  const cand=list.filter(x=>x.kinds.ai&&!faqMatch(x.q)).length;
  const k=(l,v,sub)=>{const d=mk('div','kpi');d.append(mk('small',null,l),mk('b',null,v));if(sub)d.append(mk('i',null,sub));return d};
  const kp=mk('div','kpis');kp.append(k('전체 질문',CH.length+'건'),k('즉시 응답',fastN+'건',CH.length?Math.round(fastN/CH.length*100)+'%':'-'),k('AI 응답',aiN+'건'),k('오류',errN+'건'),k('FAQ 후보',cand+'개','AI가 답했고 FAQ에 없는 질문'),k('질문 종류',list.length+'가지'));
  box.append(kp);
  if(!CH.length){box.append(mk('div','deny','아직 상담 기록이 없어요. 고객이 질문하면 여기서 분석됩니다.'));return}
  const row=mk('div','two sec');
  const s1=mk('div');s1.append(mk('h3',null,'분류별 질문'));
  const cats={};CH.forEach(c=>{const k=classify(c.q);cats[k]=(cats[k]||0)+1});
  Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{const r=mk('div','br');r.append(mk('span',null,c));const tr=mk('span','t'),f=mk('span');f.style.width=(n/CH.length*100)+'%';tr.append(f);r.append(tr,mk('span',null,n+'건'));s1.append(r)});
  const s2=mk('div');s2.append(mk('h3',null,'처리 방식'));
  [['FAQ','faq'],['상품 카드','product'],['주문 조회','order'],['AI','ai'],['오류','error']].forEach(([l,key])=>{const n=CH.filter(c=>(c.src||c.kind)===key).length;if(!n)return;const r=mk('div','br');r.append(mk('span',null,l));const tr=mk('span','t'),f=mk('span');f.style.width=(n/CH.length*100)+'%';tr.append(f);r.append(tr,mk('span',null,n+'건'));s2.append(r)});
  row.append(s1,s2);box.append(row);
  const s3=sec('자주 묻는 질문 TOP 20');
  const w=mk('div');w.style.overflowX='auto';
  const tb=mk('table'),hr=mk('tr');['질문','횟수','분류','방식','최근 답변',''].forEach(x=>hr.append(mk('th',null,x)));const th=mk('thead');th.append(hr);tb.append(th);
  const body=mk('tbody'),KL={fast:'즉시',ai:'AI',error:'오류'};
  list.slice(0,20).forEach(x=>{
    const tr=mk('tr'),main=Object.entries(x.kinds).sort((p,q)=>q[1]-p[1])[0][0];
    tr.append(mk('td','txt',x.q),mk('td','dim',x.n+'회'),mk('td','dim',classify(x.q)),mk('td','dim',KL[main]||main),mk('td','txt',x.last.a));
    const td=mk('td','dim');
    if(x.kinds.ai&&!faqMatch(x.q)){const b=mk('button','del','FAQ로 등록');b.type='button';b.onclick=async()=>{
      const n=Math.max(0,...Object.keys(D.faq).map(i=>Number(i.replace(/\D/g,''))||0))+1,id='F'+String(n).padStart(3,'0');
      const kw=x.q.replace(/[?!.,]/g,'').split(/\s+/).filter(t=>t.length>=2).slice(0,3).join(',');
      try{status('등록 중…');await db.collection('faq').doc(id).set({category:classify(x.q),q:x.q,a:x.last.a,keywords:kw,enabled:'N'});status(`${id} 등록됨 · FAQ·지식 탭에서 키워드를 확인하고 사용(Y)으로 바꾸세요`);b.disabled=true;b.textContent='등록됨'}catch(e){status('등록 실패: '+(e.message||e.code))}
    };td.append(b)}else if(faqMatch(x.q))td.append(mk('span','note','FAQ 있음'));
    tr.append(td);body.append(tr);
  });
  tb.append(body);w.append(tb);s3.append(w);
  s3.append(mk('p','note','AI가 답한 질문은 "FAQ로 등록"으로 답변을 그대로 가져올 수 있어요. 등록하면 사용(N) 상태로 들어가니 내용을 확인한 뒤 사용(Y)으로 바꾸면, 다음부터 AI 없이 바로 답합니다.'));
  box.append(s3);
}
function renderAdmin(){
  renderTabs();
  const box=$('adm');box.textContent='';
  const SPECIAL={dash:renderDash,chats:renderChats,qa:renderQA,ai:renderAI,conn:renderConn};
  if(SPECIAL[tab]){SPECIAL[tab](box);renderBar();return}
  const cfg=COLS[tab];
  if(tab==='faq')box.append(mk('p','note','사용(Y)으로 둔 항목은 챗봇이 즉시 답변하고, AI에게도 근거 정보로 전달됩니다. 키워드는 쉼표로 구분하며, 고객 질문에 키워드가 하나라도 들어 있으면 이 답변이 바로 나갑니다. 처음 들어 있는 정책(배송비, 환불 기간 등)은 예시이니 실제 운영 정책으로 고쳐 주세요.'));
  if(!loaded[tab]){box.append(mk('div','deny','불러오는 중…'));renderBar();return}
  const tb=mk('table'),hr=mk('tr');
  [KEYLABEL[tab],...cfg.cols.map(c=>c[1]),''].forEach(x=>hr.append(mk('th',null,x)));const th=mk('thead');th.append(hr);tb.append(th);
  const body=mk('tbody');
  Object.keys(D[tab]).sort().forEach(id=>{
    const r=D[tab][id],tr=mk('tr');
    const td0=mk('td');const i0=mk('input',null);i0.value=id;i0.readOnly=true;td0.append(i0);tr.append(td0);
    const ins=[];
    cfg.cols.forEach(([f,,k])=>{
      const td=mk('td',k==='nm'?'nm':'');const i=mk(k==='area'?'textarea':'input',k==='num'?'num':k==='area'?'area':'');if(k==='area')i.rows=2;i.value=r[f]==null?'':r[f];i.setAttribute('aria-label',id+' '+f);
      i.onchange=async()=>{
        const b={};cfg.cols.forEach(([ff,,kk],ix)=>{const v=ins[ix].value;b[ff]=kk==='num'?(Number(v)||0):v});
        try{status('저장 중…');await db.collection(tab).doc(id).set(b);status('저장됨')}catch(e){status('저장 실패: '+(e.message||e.code))}
      };
      ins.push(i);td.append(i);tr.append(td);
    });
    const tdd=mk('td');const d=mk('button','del','삭제');d.type='button';let armed=false,tm;
    d.onclick=async()=>{
      if(!armed){armed=true;d.textContent='한 번 더 누르면 삭제';tm=setTimeout(()=>{armed=false;d.textContent='삭제'},3000);return}
      clearTimeout(tm);try{status('삭제 중…');await db.collection(tab).doc(id).delete();status('저장됨')}catch(e){status('삭제 실패: '+(e.message||e.code))}
    };
    tdd.append(d);tr.append(tdd);body.append(tr);
  });
  tb.append(body);box.append(tb);renderBar();
}
/* ---------- 쇼핑 화면 ---------- */
let fcat='전체';
const EMO={사료:'🥣',간식:'🦴',영양제:'💊'},CCLS={사료:'a',간식:'b',영양제:'c'};
function renderFront(){
  const f=$('front');f.textContent='';
  const hero=mk('div','hero'),tx=mk('div');
  tx.append(mk('h2',null,'오늘의 특가 🐾'),mk('p',null,'우리 댕댕이 사료·간식, 오늘만 이 가격!'),mk('p','big','궁금한 건 오른쪽 보리에게 물어보세요. 상품을 누르면 재고를 바로 알려 드려요.'));
  hero.append(tx,mk('div','hero-ic','🐕'));
  const cats=mk('div','cats');
  ['전체',...new Set(Object.values(D.products).map(p=>p.category))].forEach(c=>{const b=mk('button',c===fcat?'on':'',c);b.type='button';b.onclick=()=>{fcat=c;renderFront()};cats.append(b)});
  const g=mk('div','pgrid2');
  const list=Object.entries(D.products).filter(([,p])=>fcat==='전체'||p.category===fcat);
  if(!list.length)g.append(mk('span','note','상품을 불러오는 중이에요…'));
  list.forEach(([id,p])=>{
    const q=Number((D.stock[id]||{}).qty),t=mk('button','tile');t.type='button';
    const ic=mk('div','ic c-'+(CCLS[p.category]||'a'),EMO[p.category]||'🐾');
    if(D.stock[id]){if(q<=0)ic.append(mk('span','bd no','품절'));else if(q<=5)ic.append(mk('span','bd low','소량 남음'))}
    const rate=p.price?Math.round((1-p.salePrice/p.price)*100):0;
    const pr=mk('div','tp');pr.append(mk('b',null,won(p.salePrice)));if(rate>0)pr.append(mk('span','rt',rate+'%'));
    t.append(ic,mk('div','tn',shortName(p)),pr);
    t.onclick=()=>send(`${shortName(p)} 재고 있나요?`);
    g.append(t);
  });
  f.append(hero,cats,g);

/* ---------- routing & data ---------- */
function route(){
  const admin=location.hash==='#admin';
  const root=$('root');root.classList.toggle('wide',admin&&isAdmin);root.classList.toggle('shop',!admin);document.body.classList.add('cust');$('brand').textContent=admin?'🐾 꼬순내 마켓 · 관리자':'🐾 꼬순내 마켓';
  document.querySelector('[data-view="chat"]').hidden=admin;
  const av=document.querySelector('[data-view="admin"]');av.hidden=!admin;
  $('lnkAdmin').hidden=!isAdmin||admin;$('lnkChat').hidden=!admin;
  if(admin){
    if(!isAdmin){av.textContent='';av.append(mk('div','deny','관리자 권한이 필요한 화면입니다.\n팀 계정으로 공유받은 편집 권한이 있어야 열 수 있어요.'));return}
    renderAdmin();
  }
}
function onData(c){
  if(location.hash==='#admin'&&isAdmin&&(c===tab||['dash','chats','qa','ai'].includes(tab))){
    const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#adm')&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)&&!ae.readOnly)return;
    renderAdmin();
  }else if(location.hash==='#admin'&&isAdmin)renderTabs();
}
async function init(){
  document.body.classList.add('cust');renderFront();
  window.addEventListener('hashchange',route);
  try{const u=await window.claude?.use?.('user');isAdmin=u?await u.canEdit():false;uid=u?await u.id():null}catch(e){}
  try{db=await window.claude?.use?.('db')}catch(e){}
  try{sample=await window.claude?.use?.('sample')}catch(e){}
  route();
  if(!db){$('sub').textContent='데이터에 연결되지 않았어요';add('bot','상품 데이터에 연결되지 않아 일부 안내가 제한됩니다.');return}
  if(uid)try{const m=await db.doc('chats/'+uid).get();if(m.exists)myLog=(m.data().entries||[]).slice(-150)}catch(e){}
  if(isAdmin)db.collection('chats').onSnapshot(sn=>{CH=[];sn.docs.forEach((d,i)=>{((d.data()||{}).entries||[]).forEach(e=>CH.push({...e,cust:i+1}))});CH.sort((a,b)=>b.ts-a.ts);loaded.chats=true;onData('chats')},()=>{loaded.chats=true;onData('chats')});
  db.doc('settings/agent').onSnapshot(d=>{agent=d.exists?d.data():{};loaded.settings=true;$('hdName').textContent=AG().name;if(atHome&&log.children.length===1)home();onData('settings')},()=>{});
  Object.keys(COLS).forEach(c=>{
    db.collection(c).onSnapshot(s=>{D[c]={};s.docs.forEach(d=>D[c][d.id]=d.data());loaded[c]=true;if(atHome&&log.children.length===1)setChips(homeChips());if(c==='products'||c==='stock')renderFront();onData(c)},e=>{loaded[c]=true;onData(c)});
  });
}
